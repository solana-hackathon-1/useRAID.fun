# This small dedicated bridge contains only proxy (.2) and connector (.3).
# Trust CF-Connecting-IP only from the connector, never from a LAN/client header.
map $realip_remote_addr $staging_tunnel_peer {
    default 0;
    172.30.101.3 1;
}

map $http_upgrade $staging_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 172.30.101.2:8080;
    server_name staging.useraid.fun;
    server_tokens off;
    set_real_ip_from 172.30.101.3;
    real_ip_header CF-Connecting-IP;

    if ($staging_tunnel_peer = 0) { return 403; }
    if ($host != staging.useraid.fun) { return 421; }

    add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
    add_header X-RAID-Environment staging always;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $public_web_backend http://web:3000;

    location / {
        proxy_pass $public_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host staging.useraid.fun;
        proxy_set_header X-Forwarded-Host staging.useraid.fun;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $staging_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
