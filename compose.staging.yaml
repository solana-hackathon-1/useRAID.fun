name: useraid-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app: &app
  image: ${STAGING_IMAGE:-ghcr.io/solana-hackathon-1/useraid.fun:staging}
  restart: unless-stopped
  stop_grace_period: 60s
  logging: *logging
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  environment: &safe-environment
    NODE_ENV: production
    DEMO_MODE: 'false'
    ACCOUNT_FOLDS_ENABLED: 'false'
    WALLET_LINKS_ENABLED: 'false'
    STUDIO_SANDBOX: 'false'
    ALLOW_REMOTE_TEST_DB: 'false'
    LIVE_COLLECTION_APPROVED: 'false'
    X_TRACKING_V2_ENABLED: 'false'
    X_TRACKING_V2_SETTLEMENT_ENABLED: 'false'
    LAUNCH_ENABLED: 'false'
    PAYOUT_ENABLED: 'false'
  depends_on:
    db:
      condition: service_healthy
  labels:
    com.centurylinklabs.watchtower.enable: 'true'
    com.centurylinklabs.watchtower.scope: useraid-staging

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: useraid
      POSTGRES_DB: useraid_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U useraid -d useraid_staging']
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      com.centurylinklabs.watchtower.enable: 'false'

  web:
    <<: *app
    command: ['sh', '/app/scripts/staging-start.sh', 'web']
    env_file:
      - ${STAGING_ROOT:-/opt/useraid-staging}/.env.app
      - ${STAGING_ROOT:-/opt/useraid-staging}/.env.web
    environment:
      <<: *safe-environment
      TRUSTED_IP_HEADER: x-forwarded-for
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  worker:
    <<: *app
    command: ['sh', '/app/scripts/staging-start.sh', 'worker']
    env_file:
      - ${STAGING_ROOT:-/opt/useraid-staging}/.env.app
      - ${STAGING_ROOT:-/opt/useraid-staging}/.env.worker

  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    logging: *logging
    ports: ['${STAGING_BIND_ADDRESS:-127.0.0.1}:${STAGING_HTTPS_PORT:-8443}:443']
    volumes:
      - ${STAGING_ROOT:-/opt/useraid-staging}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAGING_ROOT:-/opt/useraid-staging}/tls:/etc/nginx/tls:ro
    depends_on:
      web:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: 'false'

  watchtower:
    image: containrrr/watchtower:1.7.1@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    restart: unless-stopped
    logging: *logging
    environment:
      # Watchtower's old default API is below Docker 29's minimum. Verify on host.
      DOCKER_API_VERSION: ${STAGING_DOCKER_API_VERSION:-1.44}
      DOCKER_CONFIG: /config
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_SCOPE: useraid-staging
      WATCHTOWER_POLL_INTERVAL: '300'
      WATCHTOWER_INCLUDE_RESTARTING: 'true'
      WATCHTOWER_TIMEOUT: 60s
      # Remove superseded images after each update; each deploy is ~1.8GB.
      WATCHTOWER_CLEANUP: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STAGING_ROOT:-/opt/useraid-staging}/registry:/config:ro
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
      com.centurylinklabs.watchtower.scope: useraid-staging

volumes:
  postgres:

secrets:
  db_password:
    file: ${STAGING_ROOT:-/opt/useraid-staging}/secrets/db-password
