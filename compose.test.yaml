# Test-only override: run the compose Postgres on 55432 (override with RAID_CI_DB_PORT) so it never collides with a host Postgres on 5432.
# Usage: docker compose -p useraid-test -f compose.yaml -f compose.test.yaml up -d --wait db
services:
  db:
    ports: !override ['127.0.0.1:${RAID_CI_DB_PORT:-55432}:5432']
