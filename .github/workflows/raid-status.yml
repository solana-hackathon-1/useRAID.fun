name: RAID project status
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: raid-project-status
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read issue states and update status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-raid-status.py
      - name: Format status document
        run: npx --yes prettier@3.9.9 --write docs/raid-project-status.md
      - name: Commit refreshed status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/raid-project-status.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh RAID issue and epic status'
          git push origin HEAD:main
