name: Staging image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-image-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # The owner-selected staging VM is aarch64; publish a native ARM64 image.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: useraid
          POSTGRES_PASSWORD: useraid_ci_only
          POSTGRES_DB: useraid_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U useraid" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://useraid:useraid_ci_only@localhost:5432/useraid_test
      RUN_DB_TESTS: 'true'
      DEMO_MODE: 'false'
      ACCOUNT_FOLDS_ENABLED: 'false'
      WALLET_LINKS_ENABLED: 'false'
      LIVE_COLLECTION_APPROVED: 'false'
      X_TRACKING_V2_SETTLEMENT_ENABLED: 'false'
      LAUNCH_ENABLED: 'false'
      PAYOUT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and check source
        run: |
          npm ci
          python3 -m unittest discover -s tests -p 'test_raid_*.py'
          npm run db:generate
          npm run typecheck
          npm run lint
          npm run audit:check
      - name: Verify database and application contracts
        run: |
          npm run db:migrate
          npm test
      - name: Build production image without deployment secrets
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=useRAID staging web and worker" \
            -t useraid:publish .
      - name: Runtime image smoke
        run: |
          docker run --rm useraid:publish node -e "require.resolve('prisma/package.json'); require.resolve('tsx/package.json'); require.resolve('@prisma/client/package.json')"
          docker run --rm useraid:publish sh -c 'test ! -d /app/tests && test -d /app/prisma/migrations && sh -n /app/scripts/staging-start.sh'
          docker run --rm --name useraid-image-smoke -p 127.0.0.1:3099:3000 -e DEMO_MODE=true -d useraid:publish
          trap 'docker stop useraid-image-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3099/api/health > /tmp/useraid-health.json; then
              python3 -c 'import json; h=json.load(open("/tmp/useraid-health.json")); assert h["status"] == "ok" and h["mode"] == "demo"'
              exit 0
            fi
            sleep 2
          done
          docker logs useraid-image-smoke
          exit 1
      - name: Publish checked revision to private GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_config=$(mktemp -d)
          export DOCKER_CONFIG="$registry_config"
          trap 'rm -rf "$registry_config"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash scripts/staging-publish.sh useraid:publish
