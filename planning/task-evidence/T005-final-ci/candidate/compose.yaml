services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: useraid
      POSTGRES_PASSWORD: useraid
      POSTGRES_DB: useraid_test
    tmpfs:
      - /var/lib/postgresql/data:size=536870912
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U useraid']
      interval: 2s
      retries: 20
